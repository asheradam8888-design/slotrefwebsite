<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Gaming Hub • Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="lux-bg"></div>
  <div class="overlay"></div>

  <main class="admin-shell">
    <section id="loginSection" class="admin-panel narrow">
      <h2>Admin Login</h2>
      <p class="panel-subtitle">Sign in to manage casinos and categories.</p>

      <form id="loginForm" class="admin-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="primary-btn">Login</button>
      </form>
      <p id="loginMessage" class="status-message"></p>
    </section>

    <section id="adminSection" class="admin-panel" style="display:none;">
      <div class="admin-topbar">
        <div>
          <p class="brand-kicker">Control Center</p>
          <h1>Admin Panel</h1>
        </div>
        <button id="logoutBtn" class="secondary-btn" type="button">Logout</button>
      </div>

      <div class="admin-grid">
        <article class="admin-card">
          <h3>Contact Link</h3>
          <form id="contactForm" class="admin-form compact">
            <input type="url" id="contactUrl" placeholder="Contact URL (WhatsApp, Telegram, Email)" required>
            <button type="submit" class="primary-btn">Save Contact Link</button>
          </form>
          <p id="contactMessage" class="status-message"></p>
        </article>

        <article class="admin-card">
          <h3>Add Under By</h3>
          <form id="categoryForm" class="admin-form compact">
            <input type="text" id="categoryName" placeholder="Under by name (ex: VIP / Slots / Live)" required>
            <button type="submit" class="primary-btn">Save Under By</button>
          </form>
          <p id="categoryMessage" class="status-message"></p>

          <div class="list-head">
            <h4>Under By List</h4>
            <button id="refreshCategoriesBtn" class="chip-btn" type="button">Refresh</button>
          </div>
          <div id="categoryList" class="admin-list"></div>
        </article>

        <article class="admin-card">
          <h3>Add Casino</h3>
          <form id="casinoForm" class="admin-form compact">
            <input type="text" id="name" placeholder="Casino Name" required>
            <input type="file" id="logoFile" accept="image/*" required>
            <textarea id="description" placeholder="Description" required></textarea>
            <select id="categoryId">
              <option value="">No under by</option>
            </select>
            <input type="url" id="playerUrl" placeholder="Player URL (optional)">
            <input type="url" id="agentUrl" placeholder="Agent URL (optional)">
            <button type="submit" class="primary-btn">Save Casino</button>
          </form>
          <p id="casinoMessage" class="status-message"></p>
        </article>
      </div>

      <article class="admin-card full-width">
        <div class="list-head">
          <h3>Casinos</h3>
          <button id="refreshCasinosBtn" class="chip-btn" type="button">Refresh</button>
        </div>
        <div id="adminCasinoList" class="casino-cards"></div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
